<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تخصيص الموقع والتحقق بالرمز</title>
    <!-- مكتبة EmailJS لإرسال رمز التحقق الحقيقي للإيميل -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("6eAHAJc4xoNV54Z_S"); // تم إدخال مفتاحك العام
        })();
    </script>
    
    <style>
        body {
            background-color: #0f111a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        /* 1. تصميم شريط الحقوق (مربع واحد وبحجم صغير ورابط التيك توك) */
        .creator-footer {
            background: rgba(18, 20, 32, 0.85); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 11px;
            font-family: sans-serif;
            padding: 6px 12px;
            border-radius: 10px;
            display: inline-block;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
        }

        .creator-footer .badge-text {
            color: #9ca3af; 
        }

        .creator-footer .badge-link {
            color: #a855f7; 
            text-decoration: none;
            font-weight: bold;
            margin-right: 4px;
        }

        .creator-footer .badge-link:hover {
            text-decoration: underline;
        }

        /* 2. تصميم صناديق تسجيل الدخول وإدخال الرمز */
        .auth-box, .dashboard-box {
            background: rgba(18, 20, 32, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            width: 320px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        input {
            width: 85%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1a1d2d;
            color: #fff;
            text-align: center;
        }

        button {
            background: #a855f7;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: #9333ea;
        }

        #auth-msg {
            font-size: 12px;
            margin-top: 10px;
            color: #f87171;
        }
    </style>
</head>
<body>

    <!-- خطوة 1: إدخال الإيميل لإرسال الرمز -->
    <div id="step-email" class="auth-box">
        <h3>التحقق من البريد الإلكتروني</h3>
        <input type="email" id="user-email" placeholder="أدخل إيميلك الحقيقي..." required>
        <br>
        <button onclick="sendOTPCode()">إرسال رمز التحقق</button>
        <p id="auth-msg"></p>
    </div>

    <!-- خطوة 2: إدخال الرمز الذي وصل للإيميل (مخفي بالبداية) -->
    <div id="step-verify" class="auth-box" style="display: none;">
        <h3>أدخل رمز التحقق</h3>
        <p style="font-size: 11px; color: #aaa;">تم إرسال رمز من 4 أرقام إلى بريدك</p>
        <input type="text" id="entered-code" placeholder="أدخل الرمز هنا..." maxlength="4">
        <br>
        <button onclick="verifyOTP()">تأكيد الرمز</button>
        <p id="verify-msg"></p>
    </div>

    <!-- خطوة 3: لوحة التحكم لتغيير الألوان (تظهر بعد نجاح الرمز) -->
    <div id="dashboard" class="dashboard-box" style="display: none;">
        <h3>تم التحقق بنجاح!</h3>
        <p style="font-size: 12px; color: #aaa;">يمكنك الآن تغيير لون المربع:</p>
        <input type="color" id="color-picker" onchange="changeBoxColor(this.value)">
        <br><br>
        <button onclick="resetSession()" style="background: #ef4444;">إعادة تعيين / خروج</button>
    </div>

    <!-- شريط الحقوق المطلوب -->
    <div class="creator-footer" id="target-box">
        <span class="badge-text">صانع الموقع:</span> 
        <a href="https://www.tiktok.com/@tw6.4" target="_blank" class="badge-link">tw6.4</a>
    </div>

    <script>
        let generatedCode = "";
        let targetEmail = "";

        // توليد رمز عشوائي وإرساله للإيميل عبر مفاتيحك
        function sendOTPCode() {
            targetEmail = document.getElementById('user-email').value;
            const msg = document.getElementById('auth-msg');

            if (!targetEmail) {
                msg.innerText = "الرجاء إدخال البريد الإلكتروني!";
                return;
            }

            // توليد رمز عشوائي مكون من 4 أرقام
            generatedCode = Math.floor(1000 + Math.random() * 9000).toString();

            msg.style.color = "yellow";
            msg.innerText = "جاري إرسال الرمز إلى إيميلك...";

            // إرسال الرمز باستخدام معرفاتك (Service ID و Template ID)
            emailjs.send("service_986xjt2", "template_todndm5", {
                to_email: targetEmail,
                pass_code: generatedCode
            }).then(function(response) {
                document.getElementById('step-email').style.display = 'none';
                document.getElementById('step-verify').style.display = 'block';
            }, function(error) {
                msg.style.color = "#f87171";
                msg.innerText = "فشل الإرسال، تأكد من إيميلك.";
            });
        }

        // مطابقة الرمز الذي أدخله المستخدم مع الرمز المرسل
        function verifyOTP() {
            const userInput = document.getElementById('entered-code').value;
            const verifyMsg = document.getElementById('verify-msg');

            if (userInput === generatedCode) {
                document.getElementById('step-verify').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else {
                verifyMsg.style.color = "#f87171";
                verifyMsg.innerText = "الرمز غير صحيح، حاول مرة أخرى.";
            }
        }

        // دالة تغيير لون المربع
        function changeBoxColor(color) {
            document.getElementById('target-box').style.background = color;
        }

        // الخروج
        function resetSession() {
            location.reload();
        }
    </script>
</body>
</html>
